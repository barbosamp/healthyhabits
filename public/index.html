<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cronômetro BJJ – TV</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/tv.css">
</head>
<body class="status-idle phase-work mode-rounds">

  <!-- Navegadores exigem uma interação para liberar som e tela cheia. -->
  <div id="unlock" class="overlay">
    <div class="unlock-box">
      <img src="/icon.svg" alt="" class="unlock-logo">
      <h1>Cronômetro de Jiu-Jitsu</h1>
      <p>Pressione <b>OK</b> no controle da TV (ou clique) para ativar a tela e o som.</p>
      <button id="unlockBtn" autofocus>Ativar tela</button>
    </div>
  </div>

  <header class="top">
    <div id="roundLabel" class="round-label"></div>
    <div class="top-right">
      <span id="connDot" class="dot"></span>
      <span id="connText" class="conn-text"></span>
      <span>Sala <b id="roomCode">----</b></span>
      <span id="peers" class="peers"></span>
      <span id="soundOff" class="sound-off" hidden>🔇</span>
    </div>
  </header>

  <!-- Treino em rounds, timer e cronômetro -->
  <main id="timerView" class="timer-view">
    <div id="phaseLabel" class="phase-label"></div>
    <div id="time" class="time">0:00</div>
    <div id="nextLabel" class="next-label"></div>
    <div class="bar"><i id="bar"></i></div>
  </main>

  <!-- Placar de luta -->
  <main id="matchView" class="match-view" hidden>
    <div class="athlete athlete-a" id="rowA">
      <div class="strip"></div>
      <div class="name" id="nameA"></div>
      <div class="box adv"><small>VANT</small><span id="advA">0</span></div>
      <div class="box pen"><small>PUN</small><span id="penA">0</span></div>
      <div class="points" id="ptsA">0</div>
    </div>
    <div class="athlete athlete-b" id="rowB">
      <div class="strip"></div>
      <div class="name" id="nameB"></div>
      <div class="box adv"><small>VANT</small><span id="advB">0</span></div>
      <div class="box pen"><small>PUN</small><span id="penB">0</span></div>
      <div class="points" id="ptsB">0</div>
    </div>
    <div class="match-clock">
      <div id="matchPhase" class="match-phase">LUTA</div>
      <div id="matchTime" class="match-time">5:00</div>
    </div>
  </main>

  <aside id="connect" class="connect">
    <div id="qr" class="qr"></div>
    <div class="connect-text">
      <div class="connect-title">Controle pelo celular</div>
      <div>Escaneie o QR code ou acesse</div>
      <div id="remoteUrl" class="remote-url"></div>
      <div>e digite a sala <b id="roomCode2">----</b></div>
    </div>
  </aside>

  <button id="fullscreenBtn" class="fs-btn" title="Tela cheia" tabindex="-1">⛶</button>

  <script src="/vendor/qrcode-1.0.0.min.js"></script>
  <script src="/vendor/peerjs-1.5.4.min.js"></script>
  <script src="/shared/timer.js"></script>
  <script src="/shared/state.js"></script>
  <script src="/shared/sync.js"></script>
  <script src="/shared/sound.js"></script>
  <script src="/tv.js"></script>
</body>
</html>
